# ============================================
# STEP 1: Find Your Employee ID
# ============================================
# Copy this query and run it in your GraphQL playground
# Replace "mihaela" with your email/name

query Step1_FindMyEmployeeId {
  Employee(where: {
    _or: [
      {email: {_ilike: "%mihaela%"}},
      {firstName: {_ilike: "%mihaela%"}},
      {fullName: {_ilike: "%mihaela%"}}
    ]
  }) {
    id
    fullName
    email
  }
}

# ============================================
# STEP 2: Find Razvan's Employee Record
# ============================================

query Step2_FindRazvanEmployee {
  Employee(where: {
    _or: [
      {firstName: {_ilike: "%Razvan%"}},
      {lastName: {_ilike: "%Razvan%"}},
      {fullName: {_ilike: "%Razvan%"}}
    ]
  }) {
    id
    fullName
    email
    isActive
    employeePosition {
      id
      title
      supervisorEmployeeId
      supervisor {
        id
        fullName
        email
      }
    }
  }
}

# ============================================
# STEP 3: Check All Your Team Members
# ============================================
# Replace YOUR_EMPLOYEE_ID with the ID from Step 1

query Step3_CheckMyTeamMembers {
  Employee(where: {
    employeePosition: {
      supervisorEmployeeId: {_eq: "YOUR_EMPLOYEE_ID"}
    },
    isActive: {_eq: true}
  }) {
    id
    fullName
    email
    isActive
    employeePosition {
      id
      title
      supervisorEmployeeId
    }
  }
}

# ============================================
# STEP 4: Check Razvan's Expense Requests
# ============================================

query Step4_CheckRazvanExpenseRequests {
  ExpenseRequest(where: {
    employee: {
      _or: [
        {firstName: {_ilike: "%Razvan%"}},
        {lastName: {_ilike: "%Razvan%"}},
        {fullName: {_ilike: "%Razvan%"}}
      ]
    }
  }) {
    id
    code
    title
    status
    isDeleted
    currencyRef
    requestDate
    totalAmount
    employee {
      id
      fullName
      employeePosition {
        supervisorEmployeeId
        supervisor {
          id
          fullName
        }
      }
    }
  }
}

# ============================================
# STEP 5: Check All Team Expense Requests
# ============================================
# Replace YOUR_EMPLOYEE_ID with the ID from Step 1

query Step5_CheckAllTeamExpenseRequests {
  ExpenseRequest(where: {
    employee: {
      employeePosition: {
        supervisorEmployeeId: {_eq: "YOUR_EMPLOYEE_ID"}
      }
    },
    isDeleted: {_eq: false}
  },
  orderBy: {requestDate: DESC}
  ) {
    id
    code
    title
    status
    currencyRef
    requestDate
    totalAmount
    isDeleted
    employee {
      id
      fullName
      email
    }
  }
}

# ============================================
# ALTERNATIVE: Use Variables
# ============================================
# This is cleaner - paste this query and use the Variables panel

query CheckTeamAndRequests($myEmployeeId: uuid!) {
  # My team members
  teamMembers: Employee(where: {
    employeePosition: {
      supervisorEmployeeId: {_eq: $myEmployeeId}
    },
    isActive: {_eq: true}
  }) {
    id
    fullName
    email
  }
  
  # Team expense requests
  teamRequests: ExpenseRequest(where: {
    employee: {
      employeePosition: {
        supervisorEmployeeId: {_eq: $myEmployeeId}
      }
    },
    isDeleted: {_eq: false}
  },
  orderBy: {requestDate: DESC}
  ) {
    id
    code
    title
    status
    currencyRef
    requestDate
    employee {
      id
      fullName
    }
  }
}

# Variables for the query above (paste in Variables panel):
# {
#   "myEmployeeId": "YOUR_EMPLOYEE_ID"
# }

