name: Sync PR to Bitbucket

# Triggers when a PR targeting develop is opened, re-opened, or updated
on:
  pull_request:
    types: [opened, reopened, synchronize]
    branches:
      - develop

jobs:
  sync-pr:
    name: Mirror PR branch to Bitbucket
    runs-on: ubuntu-latest

    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.head_ref }}

      - name: Merge latest Bitbucket develop into branch
        env:
          BB_USERNAME: ${{ secrets.BITBUCKET_USERNAME }}
          BB_ACCESS_TOKEN: ${{ secrets.BITBUCKET_ACCESS_TOKEN }}
          BB_WORKSPACE: ${{ secrets.BITBUCKET_WORKSPACE }}
          BB_REPO_SLUG: ${{ secrets.BITBUCKET_REPO_SLUG }}
        run: |
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"

          git remote add bitbucket \
            "https://${BB_USERNAME}:${BB_ACCESS_TOKEN}@bitbucket.org/${BB_WORKSPACE}/${BB_REPO_SLUG}.git"

          # Pull latest develop from Bitbucket and merge into this branch
          git fetch bitbucket develop
          git merge bitbucket/develop --no-edit

      - name: Push branch to Bitbucket
        env:
          BB_USERNAME: ${{ secrets.BITBUCKET_USERNAME }}
          BB_ACCESS_TOKEN: ${{ secrets.BITBUCKET_ACCESS_TOKEN }}
          BB_WORKSPACE: ${{ secrets.BITBUCKET_WORKSPACE }}
          BB_REPO_SLUG: ${{ secrets.BITBUCKET_REPO_SLUG }}
        run: |
          git push bitbucket "HEAD:refs/heads/${{ github.head_ref }}" --force

      - name: Create Bitbucket PR (if one does not exist yet)
        env:
          BB_USERNAME: ${{ secrets.BITBUCKET_USERNAME }}
          BB_ACCESS_TOKEN: ${{ secrets.BITBUCKET_ACCESS_TOKEN }}
          BB_WORKSPACE: ${{ secrets.BITBUCKET_WORKSPACE }}
          BB_REPO_SLUG: ${{ secrets.BITBUCKET_REPO_SLUG }}
        run: |
          BRANCH="${{ github.head_ref }}"
          PR_TITLE="${{ github.event.pull_request.title }}"
          GH_PR_NUMBER="${{ github.event.pull_request.number }}"
          BB_AUTH=$(echo -n "${BB_USERNAME}:${BB_ACCESS_TOKEN}" | base64)

          # Check if an open PR already exists for this branch on Bitbucket
          EXISTING=$(curl -s \
            -H "Authorization: Basic ${BB_AUTH}" \
            "https://api.bitbucket.org/2.0/repositories/${BB_WORKSPACE}/${BB_REPO_SLUG}/pullrequests?q=source.branch.name=%22${BRANCH}%22+AND+state=%22OPEN%22")

          PR_COUNT=$(echo "$EXISTING" | jq '.size')

          if [ "$PR_COUNT" -eq "0" ]; then
            echo "Creating Bitbucket PR for branch: $BRANCH"
            curl -s -f -X POST \
              -H "Authorization: Basic ${BB_AUTH}" \
              -H "Content-Type: application/json" \
              "https://api.bitbucket.org/2.0/repositories/${BB_WORKSPACE}/${BB_REPO_SLUG}/pullrequests" \
              -d "$(jq -n \
                --arg title "$PR_TITLE" \
                --arg branch "$BRANCH" \
                --arg gh_pr "$GH_PR_NUMBER" \
                '{
                  title: $title,
                  source: { branch: { name: $branch } },
                  destination: { branch: { name: "develop" } },
                  description: ("Synced from GitHub PR #" + $gh_pr)
                }')"
            echo "Bitbucket PR created."
          else
            echo "Bitbucket PR already exists for branch: $BRANCH — branch updated."
          fi
