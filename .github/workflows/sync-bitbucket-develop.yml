name: Sync Bitbucket develop to GitHub

# Keeps GitHub's develop branch up to date with Bitbucket's develop.
# Runs every 15 minutes and can also be triggered manually.
on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync-develop:
    name: Pull latest develop from Bitbucket
    runs-on: ubuntu-latest

    steps:
      - name: Checkout GitHub develop
        uses: actions/checkout@v4
        with:
          ref: develop
          fetch-depth: 0

      - name: Merge Bitbucket develop and push to GitHub
        env:
          BB_ACCESS_TOKEN: ${{ secrets.BITBUCKET_ACCESS_TOKEN }}
          BB_WORKSPACE: ${{ secrets.BITBUCKET_WORKSPACE }}
          BB_REPO_SLUG: ${{ secrets.BITBUCKET_REPO_SLUG }}
        run: |
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"

          git remote add bitbucket \
            "https://x-token-auth:${BB_ACCESS_TOKEN}@bitbucket.org/${BB_WORKSPACE}/${BB_REPO_SLUG}.git"

          git fetch bitbucket develop

          # Skip if already up to date
          if git merge-base --is-ancestor bitbucket/develop HEAD; then
            echo "GitHub develop is already up to date with Bitbucket. Nothing to do."
            exit 0
          fi

          git merge bitbucket/develop --no-edit
          git push origin develop
          echo "GitHub develop updated with latest from Bitbucket."
