# Manual Publishing with Custom Screen Selection:
#
# Both `publish-manual` and `publish-manual-prod` pipelines support optional variables:
#
# SCREENS_TO_PUBLISH:
# - Allows you to specify which screens to publish instead of using automatic change detection
# - Leave empty (default) to use change detection
# - Set to a comma-separated list of screen paths:
#   Example: "crm/common/apps/lead-record,hr/core/apps/employee-record,fin/expenses/forms/expense-form"
# - Screen paths should be relative to src/business-apps/ directory
#
# PUBLISH_ALL_SCREENS:
# - When set to "true", publishes ALL screens in the repository
# - Supported in both 'publish-manual' (DEV) and 'publish-manual-prod' (PROD) custom pipelines
# - Ignores SCREENS_TO_PUBLISH and change detection when enabled
# - Use with caution: this will publish every screen found in src/business-apps/
# - Default: "false"
#
# PUBLISH_TARGET (production only):
# - Selects which production target receives artifact promotion and screen sync
# - all: primary/gravity and secondary/demo (default)
# - primary: gravity only
# - secondary: demo only
#
# Weekly SMS smoke (schedule via Bitbucket UI on custom pipeline `sms-smoke-weekly`):
# - Release gate (fail): SETUP/FETCH/FATAL, E1 dev dup keys, E2 dev lottery, E3 full-catalog RC blobs.
# - Warn only: E1 prod dup keys, W1–W10 (drift, legacy, orphans, etc.).
# - Requires dev + prod1 SMS OAuth; prod2 optional; RC Azure (AZURE_*_PROD) for E3.
#
# Resource URL sync (production only):
# - Resource URL creation is a separate automatic step after production publish
# - Publish always creates `published-screens.txt` artifact with successfully promoted screens
# - Creation step consumes EXACTLY `published-screens.txt` and creates missing URLs only
# - Final release gate fails the pipeline after screen release and resource URL creation both ran
#
# SECONDARY TARGET (optional):
# - To deploy to a second system in addition to staging, set the following vars
# - When all are present, publishing and screen sync will run for BOTH targets
# - Azure Blob Storage:
#   AZURE_STORAGE_ACCOUNT_PROD_SECONDARY
#   AZURE_STORAGE_SAS_TOKEN_PROD_SECONDARY
#   AZURE_BLOB_CONTAINER_NAME_PROD_SECONDARY
# - Screen/Navigation services:
#   SCREEN_MANAGEMENT_SERVICE_API_PROD_SECONDARY
#   NAVIGATION_SERVICE_API_PROD_SECONDARY
# - OAuth (for secondary):
#   OAUTH_CLIENT_ID_PROD_SECONDARY
#   OAUTH_CLIENT_SECRET_PROD_SECONDARY
#   OAUTH_URL_PROD_SECONDARY
#   OAUTH_REALM_PROD_SECONDARY

image: node:20.19.6
definitions:
  services:
    docker-large:
      memory: 15360
      type: docker
  caches:
    npm:
      key:
        files:
          - package-lock.json
      path: ~/.npm

  steps:
    - step: &check-hash-file-change
        name: Check hash file change
        runs-on:
          - 'self.hosted'
          - 'do.global.runner.size1'
        size: 1x
        clone:
          enabled: true
          depth: full
        script:
          - set -e
          - |
            PROD_HASH_FILE="component-hashes-prod.json"

            if [ -z "${BITBUCKET_PR_DESTINATION_BRANCH:-}" ]; then
              echo "Not a PR build (BITBUCKET_PR_DESTINATION_BRANCH not set). Skipping."
              exit 0
            fi

            echo "Verifying that ${PROD_HASH_FILE} was NOT changed in this PR..."

            git fetch origin "${BITBUCKET_PR_DESTINATION_BRANCH}"

            CHANGED_FILES="$(git diff --name-only "origin/${BITBUCKET_PR_DESTINATION_BRANCH}...HEAD" || true)"

            if echo "${CHANGED_FILES}" | grep -Fxq "${PROD_HASH_FILE}"; then
              echo "${PROD_HASH_FILE} was modified in this PR. Changes to this file are not allowed."
              exit 1
            fi

            echo "OK - ${PROD_HASH_FILE} not changed."

    - step: &detect-changed-screens
        name: Detect Changed Screens
        runs-on:
          - 'self.hosted'
          - 'do.global.runner.size1'
        size: 1x
        clone:
          enabled: true
          depth: full
        caches:
          - npm
        script:
          - bash scripts/ci-install-dependencies.sh
          - bash scripts/detect-changed-screens.sh
          - |
            echo "Changed screens:"
            cat changed-tsx.txt
        artifacts:
          - changed-tsx.txt

    - step: &publish-changed-screens
        name: Publish Changed Screens
        runs-on:
          - 'self.hosted'
          - 'do.global.runner.size4'
        size: 4x
        clone:
          enabled: true
          depth: full
        caches:
          - npm
        script:
          - bash scripts/ci-install-dependencies.sh
          - export RC_UPLOAD="true"
          - export BUNDLE_REPORT_IN_PIPELINE="true"
          - bash scripts/build-hash-detect-and-publish-screens.sh
        artifacts:
          - changed-tsx.txt

    - step: &build-screens
        name: Build Screens
        runs-on:
          - 'self.hosted'
          - 'do.global.runner.size2'
        size: 2x
        clone:
          enabled: true
          depth: full
        caches:
          - npm
        script:
          - bash scripts/ci-install-dependencies.sh
          - |
            if [ -n "$SCREENS_TO_PUBLISH" ]; then
              echo "Building specified screens: $SCREENS_TO_PUBLISH"
              echo "$SCREENS_TO_PUBLISH" | tr ',' '\n' > manual-screens.txt
              node scripts/build-changed-screens.js manual-screens.txt
            else
              echo "No screens specified, building all screens in batches"
              node scripts/build-changed-screens.js
            fi
        artifacts:
          - changed-tsx.txt
          - manual-screens.txt

    - step: &publish-changed-prod-screens
        name: Publish Changed Production Screens
        runs-on:
          - 'self.hosted'
          - 'do.global.runner.size2'
        size: 2x
        clone:
          enabled: true
          depth: full
        caches:
          - npm
        script:
          - bash scripts/ci-install-dependencies.sh
          - node scripts/publish-prod-screens.js
        artifacts:
          - changed-tsx.txt
          - published-screens.txt
          - screen-release-result.json

    - step: &publish-manual-screens
        name: Publish Manual Screens
        runs-on:
          - 'self.hosted'
          - 'do.global.runner.size2'
        size: 2x
        clone:
          enabled: true
          depth: full
        caches:
          - npm
        script:
          - bash scripts/ci-install-dependencies.sh
          - export RC_UPLOAD="true"
          - |
            if [ "$PUBLISH_ALL_SCREENS" = "true" ]; then
              echo "PUBLISH_ALL_SCREENS=true: Publishing ALL screens to development"
              echo "WARNING: This will publish every screen in the repository!"
              node scripts/publish-all-screens.js
            elif [ -n "$SCREENS_TO_PUBLISH" ]; then
              echo "Publishing specified screens: $SCREENS_TO_PUBLISH"
              echo "$SCREENS_TO_PUBLISH" | tr ',' '\n' > manual-screens.txt
              bash scripts/detect-and-publish-changed-screens.sh manual-screens.txt
            else
              echo "No screens specified, using change detection"
              bash scripts/detect-and-publish-changed-screens.sh
            fi
        artifacts:
          - changed-tsx.txt
          - manual-screens.txt

    - step: &publish-manual-prod-screens
        name: Publish Manual Production Screens
        runs-on:
          - 'self.hosted'
          - 'do.global.runner.size2'
        size: 2x
        clone:
          enabled: true
          depth: full
        caches:
          - npm
        script:
          - bash scripts/ci-install-dependencies.sh
          - |
            echo "Publishing target: ${PUBLISH_TARGET:-all}"
            if [ "$PUBLISH_ALL_SCREENS" = "true" ]; then
              echo "PUBLISH_ALL_SCREENS=true: Publishing ALL screens to production"
              echo "WARNING: This will publish every screen in the repository!"
              node scripts/publish-all-prod-screens.js
            elif [ -n "$SCREENS_TO_PUBLISH" ]; then
              echo "Publishing specified screens: $SCREENS_TO_PUBLISH"
              echo "$SCREENS_TO_PUBLISH" | tr ',' '\n' > manual-screens.txt
              node scripts/publish-prod-screens.js manual-screens.txt
            else
              echo "No screens specified, using change detection"
              node scripts/publish-prod-screens.js
            fi
        artifacts:
          - changed-tsx.txt
          - manual-screens.txt
          - all-screens.txt
          - published-screens.txt
          - screen-release-result.json
    - step: &sync-resource-urls
        name: Create Missing Resource URLs
        runs-on:
          - 'self.hosted'
          - 'do.global.runner.size2'
        size: 2x
        clone:
          enabled: true
          depth: full
        caches:
          - npm
        script:
          - bash scripts/ci-install-dependencies.sh
          - node scripts/sync-resource-urls.js
        artifacts:
          - resource-url-result.json
    - step: &release-gate
        name: Release Gate
        runs-on:
          - 'self.hosted'
          - 'do.global.runner.size1'
        size: 1x
        clone:
          enabled: true
          depth: full
        script:
          - node scripts/release-gate.js
    - step: &sonar_scan
        name: Sonar scan
        runs-on:
          - 'self.hosted'
          - 'do.global.runner.size4'
        size: 4x
        clone:
          enabled: true
          depth: full # SonarCloud scanner needs the full history to assign issues properly
        services:
          - docker-large
        script:
          - pipe: sonarsource/sonarcloud-scan:4.1.0
            variables:
              SONAR_SCANNER_OPTS: -Xmx14336m
              EXTRA_ARGS: ["-Dsonar.javascript.node.maxspace=13312"]

    - step: &sonar_scan_main
        name: Sonar scan (main)
        runs-on:
          - 'self.hosted'
          - 'do.global.runner.size4'
        size: 4x
        clone:
          enabled: true
          depth: full # SonarCloud scanner needs the full history to assign issues properly
        services:
          - docker-large
        script:
          - pipe: sonarsource/sonarcloud-scan:4.1.0
            variables:
              SONAR_SCANNER_OPTS: -Xmx14336m
              EXTRA_ARGS: ["-Dsonar.javascript.node.maxspace=13312"]

pipelines:
  pull-requests:
    "**":
      - step: *check-hash-file-change
      - parallel:
          - step: *build-screens
          - step: *sonar_scan

  branches:
    develop:
      - step: *publish-changed-screens

    hotfix/*:
      - step: *publish-changed-prod-screens
      - step: *sync-resource-urls
      - step: *release-gate

    main:
      - step: *publish-changed-prod-screens
      - step: *sync-resource-urls
      - step: *release-gate

  custom:
    sms-smoke-weekly:
      - step:
          name: SMS smoke (dev + prod1 + prod2)
          runs-on:
            - 'self.hosted'
            - 'do.global.runner.size1'
          size: 1x
          clone:
            enabled: true
            depth: 1
          caches:
            - npm
          script:
            - bash scripts/ci-install-dependencies.sh
            - node scripts/smoke-screen-management.js
          artifacts:
            - sms-smoke-report.json
            - sms-smoke-summary.md

    # Weekly Snyk Code scan + Claude auto-fix (schedule via Bitbucket UI)
    weekly-snyk-code-fix:
      - step:
          name: Snyk Code Scan & Auto-fix
          runs-on:
            - 'self.hosted'
            - 'do.global.runner.size1'
          size: 1x
          script:
            - bash scripts/claude/snyk_autofix.sh

    dry-run:
      - step: *detect-changed-screens

    sonar-scan-main:
      - step: *sonar_scan_main

    build-manual:
      - variables:
          - name: SCREENS_TO_PUBLISH
            default: ""
      - step: *build-screens

    publish-manual:
      - variables:
          - name: SCREENS_TO_PUBLISH
            default: ""
          - name: PUBLISH_ALL_SCREENS
            default: "false"
            allowed-values:
              - "true"
              - "false"
      - step: *publish-manual-screens

    publish-manual-prod:
      - variables:
          - name: SCREENS_TO_PUBLISH
            default: ""
          - name: PUBLISH_ALL_SCREENS
            default: "false"
            allowed-values:
              - "true"
              - "false"
          - name: PUBLISH_TARGET
            default: "all"
            allowed-values:
              - "all"
              - "primary"
              - "secondary"
      - step:
          name: Enforce develop/main branches for production publish
          runs-on:
            - 'self.hosted'
            - 'do.global.runner.size1'
          size: 1x
          script:
            - |
              if [ "$BITBUCKET_BRANCH" != "develop" ] && [ "$BITBUCKET_BRANCH" != "main" ]; then
                echo "publishing to production is restricted to develop or main branches. Current branch: $BITBUCKET_BRANCH"
                exit 1
              fi
      - step: *publish-manual-prod-screens
      - step: *sync-resource-urls
      - step: *release-gate

    calculate-hashes:
      - variables:
          - name: HASH_ENV
            default: "dev"
            allowed-values:
              - "dev"
              - "prod"
          - name: SCREENS
            default: ""
          - name: COMMIT_CHANGES
            default: "false"
            allowed-values:
              - "true"
              - "false"
          - name: DRY_RUN
            default: "true"
            allowed-values:
              - "true"
              - "false"
      - step:
          name: Calculate screen hashes
          runs-on:
            - 'self.hosted'
            - 'do.global.runner.size2'
          clone:
            enabled: true
            depth: full
          size: 2x
          caches:
            - npm
          script:
            - bash scripts/ci-install-dependencies.sh
            - echo "Calculating hashes for $HASH_ENV environment"
            - |
              ARGS="--env=$HASH_ENV"
              if [ -n "$SCREENS" ]; then
                ARGS="$ARGS --screens=$SCREENS"
              fi
              if [ "$COMMIT_CHANGES" = "true" ]; then
                ARGS="$ARGS --commit"
              fi
              if [ "$DRY_RUN" = "true" ]; then
                ARGS="$ARGS --dry-run"
              fi
              echo "Running: node scripts/calculate-hashes.js $ARGS"
              node scripts/calculate-hashes.js $ARGS
          artifacts:
            - component-hashes.json
            - component-hashes-prod.json

    claude-execute-only:
      - variables:
          - name: BATCH_ID
            default: "1"
          - name: CLAUDE_VERBOSE
            default: "false"
      - step:
          name: Claude Execute (plan.md only)
          runs-on:
            - 'self.hosted'
            - 'do.global.runner.size4'
          size: 4x
          clone:
            enabled: true
            depth: full
          caches:
            - npm
          script:
            - bash scripts/ci-install-dependencies.sh
            - bash scripts/claude/execute_batch.sh
          artifacts:
            - claude_execute_verbose.log
            - pr_response.json