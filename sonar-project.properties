sonar.sources=src

sonar.exclusions=\
  node_modules/**,\
  dist/**,\
  build/**,\
  .cursor/**,\
  .git/**,\
  .rovodev/**,\
  .windsurf/**,\
  .vscode/**,\
  .idea/**,\
  docs/**,\
  public/**,\
  scripts/**,\
  logs/**,\
  **/wrapped-entries/**,\
  **/coverage/**,\
  **/.nyc_output/**,\
  **/test-results/**,\
  **/__snapshots__/**,\
  **/storybook-static/**,\
  **/docs/**,\
  **/mock-data/**,\
  **/*.config.js,\
  **/*.config.mjs,\
  **/vite.config.*,\
  **/tailwind.config.*,\
  **/postcss.config.*,\
  **/eslint.config.*,\
  **/*.d.ts,\
  **/*.map.js,\
  **/*.js.map,\
  **/*.map.ts,\
  **/*.ts.map,\
  **/*.min.js,\
  **/*.bundle.js,\
  **/*.ftl,\
  **/*.md,\
  **/assets/**/*.svg,\
  **/assets/**/*.png,\
  **/assets/**/*.jpg,\
  **/assets/**/*.jpeg,\
  **/*.log,\
  **/*.backup.ts,\
  **/*.backup.tsx,\
  **/*.bak.ts,\
  **/*.bak.tsx,\
  **/*.old.ts,\
  **/*.old.tsx,\
  **/index.ts

sonar.test.inclusions=\
  **/*.test.js,\
  **/*.test.jsx,\
  **/*.spec.js,\
  **/*.spec.jsx,\
  **/*.test.ts,\
  **/*.test.tsx,\
  **/*.spec.ts,\
  **/*.spec.tsx
