sonar.sources=src

sonar.exclusions=\
  node_modules/**,\
  **/node_modules/**,\
  dist/**,\
  **/dist/**,\
  build/**,\
  **/build/**,\
  wrapped-entries/**,\
  **/wrapped-entries/**,\
  coverage/**,\
  **/coverage/**,\
  .nyc_output/**,\
  **/.nyc_output/**,\
  test-results/**,\
  **/test-results/**,\
  **/__snapshots__/**,\
  storybook-static/**,\
  **/storybook-static/**,\
  .vscode/**,\
  **/.vscode/**,\
  .idea/**,\
  **/.idea/**,\
  logs/**,\
  **/logs/**,\
  docs/**,\
  **/docs/**,\
  mock-data/**,\
  **/mock-data/**,\
  **/*.config.js,\
  **/*.config.ts,\
  **/*.config.mjs,\
  **/vite.config.*,\
  **/tailwind.config.*,\
  **/postcss.config.*,\
  **/eslint.config.*,\
  **/*.d.ts,\
  **/*.map.js,\
  **/*.js.map,\
  **/*.map.ts,\
  **/*.ts.map,\
  **/*.min.js,\
  **/*.bundle.js,\
  **/*.ftl,\
  **/*.md,\
  **/assets/**/*.svg,\
  **/assets/**/*.png,\
  **/assets/**/*.jpg,\
  **/assets/**/*.jpeg,\
  **/*.log

sonar.test.inclusions=\
  **/__tests__/**/*.js,\
  **/__tests__/**/*.ts,\
  **/__tests__/**/*.jsx,\
  **/__tests__/**/*.tsx,\
  **/*.test.js,\
  **/*.test.jsx,\
  **/*.spec.js,\
  **/*.spec.jsx,\
  **/*.test.ts,\
  **/*.test.tsx,\
  **/*.spec.ts,\
  **/*.spec.tsx

sonar.javascript.node.maxspace=5120
