sonar.exclusions=\
  # Build outputs and distributions
  **/dist/**,\
  **/build/**,\
  **/public/**,\
  # Dependencies
  **/node_modules/**,\
  # Generated files
  **/wrapped-entries/**,\
  **/*.map.ts,\
  # Configuration files
  **/*.config.js,\
  **/*.config.ts,\
  **/*.config.mjs,\
  # Type definitions (already counted in TypeScript)
  **/*.d.ts,\
  # Documentation
  **/*.md,\
  **/docs/**,\
  # Assets and static files
  **/assets/**/*.svg,\
  **/assets/**/*.png,\
  **/assets/**/*.jpg,\
  **/assets/**/*.jpeg,\
  # Logs and temporary files
  **/logs/**,\
  **/*.log,\
  # Test files (if you have any)
  **/*.test.ts,\
  **/*.test.tsx,\
  **/*.spec.ts,\
  **/*.spec.tsx,\
  # FreeMarker templates (not source code)
  **/*.ftl,\
  # Mock data
  **/mock-data/**

sonar.test.inclusions=\
  **/__tests__/**/*.js,\
  **/__tests__/**/*.ts,\
  **/__tests__/**/*.jsx,\
  **/__tests__/**/*.tsx,\
  **/*.test.js, **/*.test.jsx,\
  **/*.spec.js, **/*.spec.jsx,\
  **/*.test.ts, **/*.test.tsx,\
  **/*.spec.ts, **/*.spec.tsx

sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.typescript.lcov.reportPaths=coverage/lcov.info
