sonar.exclusions=\
  **/dist/**,\
  **/build/**,\
  **/public/**,\
  **/node_modules/**,\
  **/wrapped-entries/**,\
  **/*.map.ts,\
  **/*.config.js,\
  **/*.config.ts,\
  **/*.config.mjs,\
  **/*.d.ts,\
  **/*.md,\
  **/docs/**,\
  **/assets/**/*.svg,\
  **/assets/**/*.png,\
  **/assets/**/*.jpg,\
  **/assets/**/*.jpeg,\
  **/logs/**,\
  **/*.log,\
  **/*.ftl,\
  **/mock-data/**

sonar.test.inclusions=\
  **/__tests__/**/*.js,\
  **/__tests__/**/*.ts,\
  **/__tests__/**/*.jsx,\
  **/__tests__/**/*.tsx,\
  **/*.test.js, **/*.test.jsx,\
  **/*.spec.js, **/*.spec.jsx,\
  **/*.test.ts, **/*.test.tsx,\
  **/*.spec.ts, **/*.spec.tsx
